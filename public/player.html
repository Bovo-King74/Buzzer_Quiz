<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Quiz animazione</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="pl">

<section id="join" class="join">
  <h1>Entra in squadra</h1>
  <label>Codice partita<input id="c" maxlength="4" autocapitalize="characters" autocomplete="off"></label>
  <label>Nome del gruppo<input id="n" maxlength="16" autocomplete="off"></label>
  <label class="selfie">Selfie del gruppo
    <input id="f" type="file" accept="image/*" capture="user" hidden>
    <span id="ph">Tocca per scattare</span>
    <img id="pv" alt="" hidden>
  </label>
  <button class="ok" id="go">Entra</button>
  <p id="err"></p>
</section>

<section id="game" hidden>
  <header id="top">
    <img id="av" class="av" alt="">
    <div class="who"><small>Gruppo</small><b id="nk"></b></div>
    <div id="sc" class="big">0</div>
  </header>

  <div id="zone" data-m="locked">
    <button id="bz" disabled aria-label="Buzzer"><img src="assets/buzzer.png" alt=""></button>
    <h2 id="lb"></h2>
    <p id="sb"></p>
    <button id="chb">Chat<i id="dot" hidden></i></button>
  </div>

  <div id="chat" hidden>
    <div class="hd"><h2 style="font-size:24px">Chat</h2><button id="cx">Chiudi</button></div>
    <div class="log" id="log"></div>
    <div class="stk" id="stk"></div>
    <div class="cin"><input id="ct" maxlength="200" placeholder="Scrivi qualcosa"><button class="ok" id="cs">Invia</button></div>
  </div>
</section>

<script src="/socket.io/socket.io.js"></script>
<script>
const s = io(), $ = q => document.querySelector(q);
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cred = JSON.parse(localStorage.qz || 'null'), me = {}, avatar = null, pick = null, chatOn = true;
$('#c').value = (new URLSearchParams(location.search).get('c') || (cred && cred.code) || '').toUpperCase();

/* selfie ridotto a 200x200 prima dell'invio */
$('#f').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const i = new Image();
  i.onload = () => {
    const c = document.createElement('canvas'), m = Math.min(i.width, i.height); c.width = c.height = 200;
    c.getContext('2d').drawImage(i, (i.width - m) / 2, (i.height - m) / 2, m, m, 0, 0, 200, 200);
    avatar = c.toDataURL('image/jpeg', .72); $('#pv').src = avatar; $('#pv').hidden = false; $('#ph').hidden = true;
  };
  i.src = URL.createObjectURL(f);
};

function join(d) {
  s.emit('join', d, r => {
    if (r.err) {
      $('#err').textContent = r.err;
      if (!d.nick) { localStorage.removeItem('qz'); cred = null; }
      $('#join').hidden = false; $('#game').hidden = true; return;
    }
    cred = { code: r.code, pid: r.pid, token: r.token }; localStorage.qz = JSON.stringify(cred);
    $('#join').hidden = true; $('#game').hidden = false; $('#log').innerHTML = ''; r.hist.forEach(addMsg);
  });
}
$('#go').onclick = () => {
  const code = $('#c').value.trim().toUpperCase(), nick = $('#n').value.trim();
  if (!code || !nick || !avatar) { $('#err').textContent = 'Servono codice, nome del gruppo e selfie.'; return; }
  join({ code, nick, avatar, pid: cred && cred.pid, token: cred && cred.token });
};
s.on('connect', () => cred && join(cred));
const out = msg => { localStorage.removeItem('qz'); cred = null; $('#game').hidden = true; $('#join').hidden = false; $('#err').textContent = msg; };
s.on('kicked', () => out('Sei stato espulso. Puoi rientrare con il codice.'));
s.on('banned', () => out('Sei stato bannato dalla partita.'));
s.on('ended', () => out('La partita è terminata.'));

/* stati del buzzer */
const T = {
  lobby: ['Siete dentro', 'Aspettate che l’host avvii il gioco.'],
  locked: ['Votazioni bloccate', 'Aspetta che l’host le apra.'],
  open: ['Premi!', 'Il primo che preme risponde.'],
  answering: ['Tocca a voi', 'Rispondete ora. Aspettate il verdetto.'],
  waiting: ['Attendi', ''],
  pending: ['In attesa', 'L’host deve approvare il vostro ingresso.']
};
s.on('me', m => {
  const changed = m.mode !== me.mode; me = m; chatOn = m.chat;
  $('#av').src = m.avatar; $('#nk').textContent = m.nick; $('#sc').textContent = m.score;
  $('#zone').dataset.m = m.mode; $('#bz').disabled = m.mode !== 'open';
  $('#lb').textContent = T[m.mode][0];
  $('#sb').textContent = m.mode === 'waiting' ? (m.who ? `Sta rispondendo ${m.who}.` : 'Avete già risposto in questa manche.') : T[m.mode][1];
  $('#chb').hidden = !m.chat || m.mode === 'pending';
  if (!m.chat) $('#chat').hidden = true;
  if (changed && navigator.vibrate && (m.mode === 'open' || m.mode === 'answering')) navigator.vibrate(m.mode === 'open' ? 80 : [120, 60, 120]);
});
$('#bz').onpointerdown = () => me.mode === 'open' && s.emit('buzz');

/* chat */
fetch('/api/anims').then(r => r.json()).then(l => {
  $('#stk').innerHTML = l.map(f => `<img src="assets/anim/${encodeURIComponent(f)}" data-f="${esc(f)}" alt="">`).join('');
});
function addMsg(m) {
  const d = document.createElement('div'); d.className = 'msg' + (m.id === me.id ? ' me' : '');
  d.innerHTML = `<b>${esc(m.nick)}</b>${esc(m.text)}${m.anim ? `<img src="assets/anim/${encodeURIComponent(m.anim)}" alt="">` : ''}`;
  const l = $('#log'); l.append(d); l.scrollTop = l.scrollHeight;
}
s.on('chat', m => { addMsg(m); if ($('#chat').hidden && m.id !== me.id) $('#dot').hidden = false; });
$('#chb').onclick = () => { $('#chat').hidden = false; $('#dot').hidden = true; const l = $('#log'); l.scrollTop = l.scrollHeight; };
$('#cx').onclick = () => $('#chat').hidden = true;
$('#stk').onclick = e => {
  const i = e.target.closest('img'); if (!i) return; pick = pick === i.dataset.f ? null : i.dataset.f;
  document.querySelectorAll('#stk img').forEach(x => x.classList.toggle('on', x.dataset.f === pick));
};
const send = () => {
  const t = $('#ct').value.trim(); if (!t && !pick) return;
  s.emit('chat', { text: t, anim: pick }); $('#ct').value = ''; pick = null;
  document.querySelectorAll('#stk img').forEach(x => x.classList.remove('on'));
};
$('#cs').onclick = send; $('#ct').onkeydown = e => e.key === 'Enter' && send();
</script>
</body>
</html>
