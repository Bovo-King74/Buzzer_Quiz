<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Host · Quiz animazione</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Secondo dispositivo: apri host.html#collega -->
<section id="setup" class="setup" hidden>
  <h1>Host</h1>
  <div class="row2">
    <div class="blk">
      <h2>Collega un altro dispositivo</h2>
      <input id="jc" placeholder="Codice partita" maxlength="4" autocapitalize="characters">
      <input id="jk" placeholder="Chiave host" maxlength="8" autocapitalize="characters">
      <button class="ok" id="jn">Entra come host</button>
      <small id="jerr"></small>
    </div>
    <div class="blk">
      <h2>Oppure</h2>
      <button id="mk">Crea una nuova stanza</button>
    </div>
  </div>
</section>

<main id="app" hidden>
  <aside id="rail">
    <div id="railjoin" hidden>
      <div class="code" id="code"></div>
      <img id="qr" class="qr" alt="QR code per entrare" title="Ingrandisci">
      <small id="url"></small>
    </div>
    <div class="tg"><span>Chiave host</span><button id="key" style="margin-left:auto">Mostra</button></div>
    <small>Per seguire la serata da un altro dispositivo apri <b id="hostlink"></b> e inserisci codice e chiave.</small>
    <hr>
    <label class="tg"><input type="checkbox" id="sJoin"> Ingressi aperti</label>
    <label class="tg"><input type="checkbox" id="sApp"> Approva chi entra</label>
    <label class="tg"><input type="checkbox" id="sChat"> Chat attiva</label>
    <label class="tg"><input type="number" id="sPts" min="1" max="10"> Punti per risposta</label>
    <hr>
    <button id="bReset">Azzera punteggi</button>
    <button class="no" id="bEnd">Termina partita</button>
    <small>Scorciatoie: spazio apre e blocca, G giusta, S sbagliata.</small>
  </aside>

  <section id="stage">
    <!-- Sala d'attesa -->
    <div id="lobby">
      <div class="top">
        <div class="l"><div class="code" id="lcode"></div>
        <p>Inquadra il QR o apri <b id="lhost"></b> dal telefono e digita il codice.</p></div>
        <img id="lqr" alt="QR code per entrare" title="Ingrandisci">
      </div>
      <div class="ros">
        <h2>Gruppi connessi <small id="lcnt"></small></h2>
        <div id="lsq"></div>
      </div>
      <div class="bar"><button class="ok" id="bStart">Avvia gioco</button></div>
    </div>

    <!-- Partita in corso -->
    <div id="play" hidden>
      <div id="banner" class="locked">
        <img id="bav" class="av" alt="" hidden>
        <div><small id="bsm"></small><div class="big" id="bt"></div></div>
      </div>
      <div id="cmd">
        <button class="ok w" id="bOpen">Apri votazioni</button>
        <button id="bLock">Blocca</button>
        <button class="ok w" id="bOk">Giusta</button>
        <button class="no w" id="bKo">Sbagliata</button>
        <button id="bNew">Nuova manche</button>
      </div>
      <ol id="order"></ol>
      <div id="sqwrap">
        <h2>Classifica <small id="cnt"></small></h2>
        <div id="sq"></div>
      </div>
    </div>
  </section>

  <section id="side">
    <nav id="tabs">
      <button data-t="ac" class="on">Accessi <i id="nPend" hidden></i></button>
      <button data-t="ch">Chat</button>
    </nav>
    <div id="pane">
      <div id="p-ac"></div>
      <div id="p-ch" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">
        <div class="log" id="log"></div>
        <div class="stk" id="stk"></div>
        <div class="cin"><input id="ct" maxlength="200" placeholder="Scrivi a tutti"><button class="ok" id="cs">Invia</button></div>
      </div>
    </div>
  </section>
</main>

<div id="big" hidden><div class="code" id="bcode"></div><img id="bqr" alt=""></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const s = io(), $ = q => document.querySelector(q);
const esc = t => String(t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cred = JSON.parse(localStorage.hostGame || 'null'), INFO = null, ST = null, pick = null, keyShown = false;
const act = (type, x = {}) => s.emit('act', { type, ...x });
$('#lhost').textContent = $('#hostlink').textContent = location.host;
$('#hostlink').textContent = location.host + '/host.html#collega';

/* ---------- la stanza nasce all'apertura della pagina ---------- */
function enter(r) {
  INFO = r; cred = { code: r.code, key: r.key }; localStorage.hostGame = JSON.stringify(cred);
  $('#setup').hidden = true; $('#app').hidden = false;
  for (const id of ['#code', '#lcode', '#bcode']) $(id).textContent = r.code;
  for (const id of ['#qr', '#lqr', '#bqr']) $(id).src = r.qr;
  $('#url').textContent = r.url; $('#log').innerHTML = ''; r.hist.forEach(addMsg);
  fetch('/api/anims').then(x => x.json()).then(l => {
    $('#stk').innerHTML = l.map(f => `<img src="assets/anim/${encodeURIComponent(f)}" data-f="${esc(f)}" alt="">`).join('');
  });
}
const create = () => s.emit('host:create', { origin: location.origin }, enter);
function join(c, k, manual) {
  s.emit('host:join', { code: c, key: k, origin: location.origin }, r => {
    if (!r.err) return enter(r);
    localStorage.removeItem('hostGame'); cred = null;
    if (manual) { $('#jerr').textContent = r.err; $('#setup').hidden = false; $('#app').hidden = true; } else create();
  });
}
s.on('connect', () => {
  if (cred) join(cred.code, cred.key, false);
  else if (location.hash === '#collega') $('#setup').hidden = false;
  else create();
});
$('#jn').onclick = () => join($('#jc').value.trim().toUpperCase(), $('#jk').value.trim().toUpperCase(), true);
$('#mk').onclick = create;
s.on('ended', () => { localStorage.removeItem('hostGame'); location.hash = ''; location.reload(); });

/* ---------- stato ---------- */
s.on('state', st => { ST = st; render(); });
const row = (p, S, i) => `
  <div class="rg ${p.id === S.ans ? 'cur' : p.on ? '' : 'off'}" data-id="${p.id}">
    <span class="rk">${i + 1}</span><img class="av" src="${p.avatar}" alt="">
    <span class="nm">${esc(p.nick)}<small>${p.on ? (S.answered.includes(p.id) ? 'Ha già risposto' : 'Connesso') : 'Disconnesso'}</small></span>
    <span class="sc">${p.score}</span>
    <div class="az"><button data-a="pts" data-v="-1">−1</button><button data-a="pts" data-v="1">+1</button><button data-a="kick">Espelli</button><button class="no" data-a="ban">Banna</button></div>
  </div>`;
const plural = n => n + (n === 1 ? ' gruppo' : ' gruppi');

function render() {
  const S = ST, by = Object.fromEntries(S.players.map(p => [p.id, p]));
  const ok = S.players.filter(p => p.st === 'ok').sort((a, b) => b.score - a.score);
  $('#lobby').hidden = S.started; $('#play').hidden = !S.started; $('#railjoin').hidden = !S.started;
  $('#sJoin').checked = S.set.joinOpen; $('#sApp').checked = S.set.approve; $('#sChat').checked = S.set.chat;
  if (document.activeElement !== $('#sPts')) $('#sPts').value = S.set.pts;

  // accessi: in attesa e bannati
  const pend = S.players.filter(p => p.st === 'pending');
  $('#nPend').hidden = !pend.length; $('#nPend').textContent = pend.length;
  $('#p-ac').innerHTML = '<h2 style="padding:12px">In attesa</h2>' + (pend.length ? pend.map(p => `
    <div class="riga" data-id="${p.id}"><span></span><img class="av" src="${p.avatar}" alt=""><span class="nm">${esc(p.nick)}</span><span></span>
    <div class="az"><button class="ok" data-a="approve">Accetta</button><button data-a="reject">Rifiuta</button><button class="no" data-a="ban">Banna</button></div></div>`).join('') : '<p class="vuoto">Nessuno in attesa. Attiva «Approva chi entra» per decidere tu chi entra.</p>')
    + '<h2 style="padding:12px">Bannati</h2>' + (S.banned.length ? S.banned.map(b => `
    <div class="riga" data-id="${b.id}"><span></span><span></span><span class="nm">${esc(b.nick)}</span><span></span><div class="az"><button data-a="unban">Riammetti</button></div></div>`).join('') : '<p class="vuoto">Nessun gruppo bannato.</p>');

  if (!S.started) {  // sala d'attesa: nessun numero minimo
    $('#lcnt').textContent = plural(ok.length);
    $('#lsq').innerHTML = ok.length ? ok.map((p, i) => row(p, S, i)).join('') : '<p class="vuoto">In attesa che i telefoni inquadrino il QR code…</p>';
    $('#bStart').textContent = `Avvia gioco (${plural(ok.length)})`;
    return;
  }

  const A = by[S.ans];
  $('#banner').className = S.phase;
  $('#bt').textContent = { locked: 'Votazioni bloccate', open: 'Votazioni aperte', answering: A ? A.nick : '…' }[S.phase];
  $('#bsm').textContent = S.phase === 'answering' ? 'Sta rispondendo' : S.phase === 'open' ? 'Chi preme per primo risponde' : 'Nessuno può prenotarsi';
  $('#bav').hidden = !A; if (A) $('#bav').src = A.avatar;
  $('#bOpen').disabled = S.phase !== 'locked'; $('#bLock').disabled = S.phase === 'locked';
  $('#bOk').disabled = $('#bKo').disabled = S.phase !== 'answering';

  // ordine di prenotazione (lo vede solo l'host)
  $('#order').innerHTML = S.order.length ? S.order.map((o, i) => {
    const p = by[o.id], d = i ? ' +' + ((o.t - S.order[i - 1].t) / 1000).toFixed(1) + 's' : '';
    return `<li class="${o.id === S.ans ? 'cur' : S.answered.includes(o.id) ? 'ko' : ''}"><b>${i + 1}</b>${p ? esc(p.nick) : '(rimosso)'}<small>${new Date(o.t).toLocaleTimeString('it-IT')}${d}</small></li>`;
  }).join('') : '<li class="vuoto">Nessuna prenotazione in questa manche</li>';

  $('#cnt').textContent = plural(ok.length);
  $('#sq').innerHTML = ok.length ? ok.map((p, i) => row(p, S, i)).join('') : '<p class="vuoto">Nessun gruppo connesso.</p>';
}

/* ---------- comandi ---------- */
$('#bStart').onclick = () => act('start');
$('#bOpen').onclick = () => act('open'); $('#bLock').onclick = () => act('lock');
$('#bOk').onclick = () => act('correct'); $('#bKo').onclick = () => act('wrong'); $('#bNew').onclick = () => act('newround');
$('#bReset').onclick = () => confirm('Azzerare tutti i punteggi?') && act('reset');
$('#bEnd').onclick = () => confirm('Terminare la partita? Tutti i gruppi verranno disconnessi.') && act('end');
$('#sJoin').onchange = e => act('set', { key: 'joinOpen', v: e.target.checked });
$('#sApp').onchange = e => act('set', { key: 'approve', v: e.target.checked });
$('#sChat').onchange = e => act('set', { key: 'chat', v: e.target.checked });
$('#sPts').onchange = e => act('set', { key: 'pts', v: e.target.value });
$('#key').onclick = e => { keyShown = !keyShown; e.target.textContent = keyShown ? INFO.key : 'Mostra'; };
$('#qr').onclick = $('#lqr').onclick = () => $('#big').hidden = false; $('#big').onclick = () => $('#big').hidden = true;
const manage = e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const id = b.closest('[data-id]').dataset.id, a = b.dataset.a;
  if (a === 'ban' && !confirm('Bannare questo gruppo?')) return;
  if (a === 'kick' && !confirm('Espellere questo gruppo? Potrà rientrare.')) return;
  act(a, { id, v: b.dataset.v });
};
$('#sq').onclick = $('#lsq').onclick = $('#p-ac').onclick = manage;
$('#tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  ['ac', 'ch'].forEach(t => $('#p-' + t).hidden = t !== b.dataset.t);
};
document.addEventListener('keydown', e => {
  if (!ST || !ST.started || /INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.code === 'Space') { e.preventDefault(); act(ST.phase === 'locked' ? 'open' : 'lock'); }
  else if (e.key === 'g') act('correct'); else if (e.key === 's') act('wrong');
});

/* ---------- chat ---------- */
function addMsg(m) {
  const d = document.createElement('div'); d.className = 'msg' + (m.id === 'host' ? ' me' : '');
  d.innerHTML = `<b>${esc(m.nick)}</b>${esc(m.text)}${m.anim ? `<img src="assets/anim/${encodeURIComponent(m.anim)}" alt="">` : ''}`;
  const l = $('#log'); l.append(d); l.scrollTop = l.scrollHeight;
}
s.on('chat', addMsg);
$('#stk').onclick = e => { const i = e.target.closest('img'); if (!i) return; pick = pick === i.dataset.f ? null : i.dataset.f; document.querySelectorAll('#stk img').forEach(x => x.classList.toggle('on', x.dataset.f === pick)); };
const send = () => { const t = $('#ct').value.trim(); if (!t && !pick) return; s.emit('chat', { text: t, anim: pick }); $('#ct').value = ''; pick = null; document.querySelectorAll('#stk img').forEach(x => x.classList.remove('on')); };
$('#cs').onclick = send; $('#ct').onkeydown = e => e.key === 'Enter' && send();

// segnale acustico quando un gruppo prenota
s.on('buzz', () => { try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(); o.type = 'square'; o.frequency.value = 880; o.connect(c.destination); o.start(); o.stop(c.currentTime + .18); } catch {} });
</script>
</body>
</html>
